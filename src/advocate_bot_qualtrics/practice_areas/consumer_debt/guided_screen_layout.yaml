extra_screens:
  guided_capacity_opening:
    defense: capacity
    bodies:
    - fact_key: rule:opening_date_known
      equals: 'yes'
      text: 'According to the complaint, this account was opened on [OPEN.DATE].

        If that date is incorrect, use the date you believe you actually entered the
        agreement when answering the following questions.'
    - text: 'The complaint did not appear to include the date this account was opened.
        Try to remember when you opened the account.

        The following questions concern your age and ability to understand the agreement
        when you entered it.'
      fact_key: complaint:OPEN-DATE
      equals: 'no'
    - text: 'Ask a clarifying question with the “Ask a Question” button or speak with
        clinic staff before choosing an answer.

        When you’re ready, click the “Next” button to choose your answer.

        '
  guided_oral_modification_change:
    defense: oral_modification
    bodies:
    - text: 'Earlier, you said that [PLAINTIFF] agreed to change the original contract
        but is not honoring the new agreement.

        The following question asks whether that change or another was agreed to during
        a conversation.'
