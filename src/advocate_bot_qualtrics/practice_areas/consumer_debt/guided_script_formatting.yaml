- text: Affirmative defense conversation scripts
- text: Defenses 1 through 21 of Attachment 4
- text: INSTRUCTIONS FOR REVIEWERS
- text: Use these scripts to review the exact wording users see and the conditions that control the conversation.
    Each defense begins with its general explanation. The flow and each defense matches Attachment 4.
- text: Please review quoted wording, screening conditions, missing outcomes, and how well the defenses
    match with Attachment 4. Ignore the footnotes. Use Track Changes for proposed edits and comments for
    questions.
- text: 'Reading key: Quoted text is shown to the user. Bold directions are instructions for the chatbot
    (see shared steps across all defenses in the section below). Bracketed text is filled with collected
    information. User answers to most of the questions will be classified as Yes, No, or Not sure.'
- text: SHARED STEPS
- text: Ask about this checkbox
- text: Do you want to check off [name or description of the defenses implicated by the checkboxes]?
  list_level: 0
  list_format: bullet
  quote_container: true
- text: After recording a checkbox choice, continue to the next applicable question, regardless of whether
    the answer is Yes or No, unless the script explicitly directs otherwise.
  list_level: 0
