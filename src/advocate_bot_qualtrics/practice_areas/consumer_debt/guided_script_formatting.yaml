- text: 12 Unconscionable Contract
- text: General explanation show to everyone
- text: An unconscionable contract is one that was made unfairly and has terms that are extremely unfair
    to you.
- text: For example, important terms may have been hidden or difficult to understand, while giving the
    creditor an unfair advantage.
- text: Many litigants check off this defense because it is a broad defense.
