- text: 21 Violation of Civil Code Section 1632 Regarding Language
- text: General explanation show to everyone
- text: If you opened the credit card account with [PLAINTIFF] in another language, California law requires
    [PLAINTIFF] to provide a written translation in that language. [PLAINTIFF] must provide the required
    translation generally before the contract is signed and must include its terms.
- text: This defense may apply if you opened the account speaking a language other than English and the
    credit agreement provided to you was only in English.
- text: Use the primary language already collected
- text: 'If the user’s primary language is English:'
- text: You said that your primary language is English.
- text: This defense may not apply based on your primary language. The defense concerns an agreement mostly
    discussed in a non-English language.
- text: Finish this defense.
- text: 'If the user’s primary language is known and is not English:'
- text: You said that your primary language is [LANGUAGE].
- text: Ask about the language used to negotiate
