- text: 14 Lack of Consideration
- text: General explanation show to everyone
- text: Consideration is something of value exchanged in a contract. For a credit account, this may include
    the creditor providing credit in exchange for a promise to repay. Lack of consideration means you
    didn’t get any benefit from the creditor. The questions below ask about identity theft and whether
    you or someone you opened the account for actually used the account.
