- text: Overview
- text: Your Answer is the form you use to respond to the lawsuit. To finish your Answer, you will check
    off what defenses apply to your lawsuit, using a form called Attachment 4.  This clickthrough tool
    will help you decide whether to check off each defense or not.
- text: First, the tool will ask you to verify some details about your case. Then, it will ask additional
    questions and guide you through the 21 defenses on Attachment 4 in order. Fill out each defense in
    Attachment 4 as recorded in the clickthrough tool.
- text: 1 Statute of Limitations
- text: General explanation (show to everyone)
- text: Statute of limitations is a rule that says if [PLAINTIFF] waits too long, they cannot sue you.
    The maximum length of time they can wait varies from 2 to 6 years, depending on which state’s law
    applies. Statute of limitations is a strong defense if it applies.
- text: Even if [PLAINTIFF] sued within the time limit, it may still need to prove when you last paid.  Consider
    raising this defense in an answer if [PLAINTIFF] filed their complaint one year or more after your
    last payment.
- text: If the plaintiff is a debt buyer, use the Debt buyer path. If the plaintiff is the original creditor,
    use Original creditor timing. If the plaintiff type is unresolved, continue to “Clarify an unresolved
    answer.”
- text: Debt buyer path (plaintiff = debt buyer)
- text: Debt buyers often sue on older accounts or don't have records of a last payment you made to the
    original creditor.
- text: You are being sued by a debt buyer.
- text: People sued by debt buyers often check off the statute of limitations defense to preserve it.
- text: Ask about this checkbox.
- text: Continue directly to “Checkbox guidance” and then “Confirm selections.” Skip “Original creditor
    timing” and “Original creditor results.”
- text: Original creditor timing (plaintiff = original creditor)
- text: Use this step only if the plaintiff is the original creditor.
- text: 'If the complaint includes a last payment date:'
- text: The complaint lists your last payment as [LAST.PAYMENT.DATE], about [months between that payment
    and filing] months before it was filed.
- text: 'Ask:'
- text: Do you agree with the last payment date alleged in the complaint?
- text: 'If Yes:'
- text: You agree with the complaint that your last payment was [months between that payment and filing]
    months before the complaint was filed.
- text: Use the agreed last payment date to determine whether the payment was a year or more before filing,
    or less than a year before filing. Continue to “Original creditor results.”
- text: 'If No:'
- text: Continue to “Ask about payment timing.”
- text: 'If Not sure:'
- text: You’re not sure how much time passed between your last payment and [PLAINTIFF] filing a complaint.
    If the complaint does not give the correct last payment date, your bank records, payment confirmations,
    or account history may help you estimate when you last paid.
- text: Continue to “Ask about payment timing.”
- text: 'If the complaint does not include a last payment date:'
- text: The complaint did not appear to include the last payment date. If the complaint does not give
    the correct last payment date, your bank records, payment confirmations, or account history may help
    you estimate when you last paid.
- text: Continue to “Ask about payment timing.”
- text: Ask about payment timing
- text: 'Ask:'
- text: Was your last payment a year or more before the complaint was filed?
- text: 'If Yes:'
- text: You said your last payment was a year or more before [PLAINTIFF] filed the complaint.
- text: 'If No:'
- text: You said your last payment was less than a year before [PLAINTIFF] filed the complaint.
- text: 'If Not sure:'
- text: You’re not sure whether your last payment was more or less than a year before [PLAINTIFF] filed
    the complaint.
- text: Record the answer and continue to “Original creditor results.”
- text: Original creditor results
- text: 'If the last payment was less than a year before the complaint was filed:'
- text: This defense does not apply if you’re certain your last payment to [PLAINTIFF] was less than one
    year before the complaint was filed.
- text: Finish this defense. Skip “Checkbox guidance” and “Confirm selections.”
- text: 'If the last payment was a year or more before filing OR the user is Not sure:'
- text: Consider raising this defense if [PLAINTIFF] filed their complaint one year or more after your
    last payment.
- text: You think your last payment could be a year or more before the complaint was filed.
- text: Ask about this checkbox. Continue to “Checkbox guidance” and then “Confirm selections.”
- text: Checkbox guidance
- text: Show this step to every debt-buyer user and to original-creditor users whose last payment was
    a year or more before filing or whose timing answer is Not sure.
- text: The statute of limitations periods differ depending on which state rule applies. People in this
    situation often check off the first and third indented checkboxes under “Statute of Limitations” in
    case California or Delaware law applies to their contracts.
- text: Ask about this checkbox.
- text: 'If the user previously indicated that the contract was oral:'
- text: Oral contracts have shorter statute of limitations. You’ve indicated your contract with [ORIGINAL.CREDITOR]
    was oral. People in this situation often check off the second indented checkbox under “Statute of
    Limitations.”
- text: Ask about this checkbox.
- text: 'If the user previously indicated that the contract was not oral:'
- text: You’ve indicated your contract with [ORIGINAL.CREDITOR] was in writing. The defense under the
    second indented checkbox does not apply.
- text: If the oral-contract answer is unresolved, continue to “Clarify an unresolved answer” for that
    nested option.
- text: Continue to “Confirm selections.”
- text: SOL Checkbox Offer
- text: Dependency Conditions
- text: Main
- text: Debt buyer; or original creditor with qualifying or explicitly uncertain timing
- text: First and third nested
- text: Same condition as main
- text: Second nested
- text: Same condition as main, plus oral agreement
- text: 2 Ambiguity
- text: General explanation show to everyone
- text: 'Ambiguity means something is unclear. For example, ambiguity may apply if you are at all confused
    about:'
- text: the complaint; or
  list_level: 0
  list_format: bullet
- text: the amount sued for; or
  list_level: 0
  list_format: bullet
- text: what the charges are.
  list_level: 0
  list_format: bullet
- text: The documents filed with the court may also be ambiguous because they do not contain your entire
    account history or contract. This means you may need to ask for more information from [PLAINTIFF]
    later.
- text: Many people check off ambiguity, since it is a broad defense.
- text: Ask about this checkbox.
- text: Continue to “Confirm selections.”
- text: 3 Standing and Privity
- text: General explanation show to everyone
- text: To sue for your debt, [PLAINTIFF] must provide proof of a legal relationship such as a contract
    or agreement with you. t.
- text: Restate what the complaint includes
- text: 'If the complaint states that the plaintiff owns the debt and has the right to collect:'
- text: In the complaint, [PLAINTIFF] stated it is the legal owner of the debt and has the right to bring
    a case to collect debt.
- text: 'If the complaint does not make that statement:'
- text: In the complaint, [PLAINTIFF] failed to state it is the legal owner of the debt and has the right
    to bring a case to collect debt.
- text: 'For original-creditor cases only, also show the matching attachment statement:'
- text: 'If an agreement showing ownership is attached:'
- text: '[PLAINTIFF] attached a copy of the agreement showing it has ownership over the debt.'
- text: 'If that agreement is not attached:'
- text: '[PLAINTIFF] did not attach a copy of the agreement showing it has ownership over the debt.'
- text: Debt buyer path
- text: Use this path if the plaintiff is a debt buyer.
- text: A debt buyer may be a company you have never heard of before. Debt buyers typically will purchase
    the account from the original company you had the account for pennies on the dollar. In order to succeed
    in court, the third party debt buyer must show documents to the court about the transfer of the account
    to them proving that they a) are the legal owner; and b) you are required to pay them.  , debt buyers
    often have difficulty producing paperwork that proves they are legal owners of debt. Many litigants
    sued by debt buyers check off the standing/privity defense to preserve it.
- text: Ask about this checkbox.
- text: 'If the complaint states that the plaintiff owns the debt and has the right to collect:'
- text: The defense in the first indented checkbox does not apply since [PLAINTIFF] stated it is the legal
    owner of the debt and has the right to collect.
- text: 'If the complaint does not make that statement:'
- text: The first indented checkbox may apply since [PLAINTIFF] did not state it is the legal owner of
    the debt or it has the right to collect. Many people in this situation check off the first indented
    checkbox.
- text: Ask about this checkbox.
- text: 'For every debt-buyer case, also show:'
- text: The second indented checkbox may apply since debt buyers like [PLAINTIFF] have more difficulty
    producing paperwork that proves they are legal owners of debt. Even if [PLAINTIFF] attached a copy
    of an agreement showing ownership over debt, it still must be verified by the court at trial. Many
    people in this situation check off the second indented checkbox.
- text: Ask about this checkbox.
- text: Continue to “Confirm selections.” Skip the “Original creditor path.”
- text: Original creditor path
- text: 'If the complaint states ownership AND the agreement showing ownership is attached:'
- text: The standing/privity defense does not apply since [PLAINTIFF] has stated it actually owns the
    debt and has attached a copy of the agreement showing it has ownership over the debt.
- text: Finish this defense.
- text: 'If the ownership statement is missing OR the agreement showing ownership is not attached:'
- text: The standing/privity defense may apply since [PLAINTIFF] hasn’t stated it actually owns the debt
    or hasn’t attached a copy of the agreement showing it has ownership over the debt. Many people in
    this situation check off the standing/privity defense to preserve it.
- text: Ask about this checkbox.
- text: 'Show the matching response for each nested checkbox:'
- text: 'Ownership statement present:'
- text: The defense in the first indented checkbox does not apply since [PLAINTIFF] stated it is the legal
    owner of the debt and has the right to collect.
- text: 'Ownership statement missing:'
- text: The defense in the first indented checkbox may apply since [PLAINTIFF] does not appear to state
    it owns your debt. Many people in this situation check off the first indented checkbox.
- text: Ask about this checkbox.
- text: 'Agreement showing ownership attached:'
- text: The defense in the second indented checkbox does not apply since [PLAINTIFF] attached a copy of
    the agreement showing it has ownership over the debt.
- text: 'Agreement showing ownership not attached:'
- text: The defense in the second indented checkbox may apply since [PLAINTIFF] did not attach a copy
    of the agreement showing it has ownership over the debt. Many people in this situation check off the
    second indented checkbox.
- text: Ask about this checkbox.
- text: Continue to “Confirm selections.”
- text: 4 Failure to State a Cause of Action
- text: General explanation show to everyone
- text: To sue for your debt, [PLAINTIFF] must follow certain requirements by making certain statements
    in the complaint .
- text: Restate what the complaint includes
- text: 'If the complaint states that the plaintiff owns the debt:'
- text: The complaint states that [PLAINTIFF] owns the debt.
- text: 'For each of the following included items, show the corresponding statement. Skip an item that
    is not included:'
- text: If the complaint includes
- text: Show
- text: An account statement
- text: The complaint includes an account statement.
- text: An ownership allegation
- text: The complaint includes a statement that [PLAINTIFF] owns the debt.
- text: The document recorded as ownership proof
- text: The complaint includes a document about ownership of the debt.
- text: An account-opening date
- text: The complaint includes an account-opening date of [OPEN.DATE].
- text: A last payment date
- text: The complaint includes a last payment date of [LAST.PAYMENT.DATE].
- text: Use the complaint’s contents for these checks.
- text: Show the explanation for the plaintiff type
- text: 'If the plaintiff is a debt buyer:'
- text: Debt buyers must identify the original creditor in the complaint, and state that they own the
    debt. The complaint should contain basic information about the debt like the date you opened the account
    and breach date (or last payment date). Debt buyers must attach their debt transfer contract with
    [ORIGINAL.CREDITOR] or another company, or provide a final account statement with a charge-off date
    from [ORIGINAL.CREDITOR].
- text: 'If the plaintiff is the original creditor:'
- text: Original creditors must state that they own the debt. The complaint should contain basic information
    about the debt like the date you opened the account and breach date (or last payment date).
- text: If the complaint includes Breach of Contract, follow “Breach of Contract checks.” If it includes
    Common Counts, follow “Common Counts checks.” If it includes both, follow both groups. Show every
    matching response within each group.
- text: Breach of Contract checks
- text: A Missing original creditor — debt-buyer cases only
- text: 'If the complaint does not identify the original creditor:'
- text: The debt buyer did not identify the original creditor in the complaint. The defense in the first
    indented checkbox under “Breach of Contract” may apply. Many people in this situation check this defense.
- text: Ask about this checkbox.
- text: B Missing ownership allegation — either plaintiff type
- text: 'If the complaint does not state that the plaintiff legally owns the debt and has the right to
    sue, show the response for the plaintiff type:'
- text: 'Debt buyer:'
- text: The debt buyer did not state it legally owns the debt and has the right to sue on it in the complaint.
    The defense in the second indented checkbox under “Breach of Contract” may apply. Many people in this
    situation check this defense.
- text: Ask about this checkbox.
- text: 'Original creditor:'
- text: The original creditor did not state it legally owns the debt and has the right to sue on it in
    the complaint. The defense in the second indented checkbox under “Breach of Contract” may apply. Many
    people in this situation check this defense.
- text: Ask about this checkbox.
- text: C Missing account-opening date — either plaintiff type
- text: 'If the opening date is not found in the complaint, show the response for the plaintiff type:'
- text: 'Debt buyer:'
- text: The debt buyer did not include the date you opened the account in the complaint. The defense in
    the third indented checkbox under “Breach of Contract” may apply. Many people in this situation check
    this defense.
- text: Ask about this checkbox.
- text: 'Original creditor:'
- text: The original creditor did not include the date you opened the account in the complaint. The defense
    in the third indented checkbox under “Breach of Contract” may apply. Many people in this situation
    check this defense.
- text: Ask about this checkbox.
- text: D Missing last payment and breach dates — either plaintiff type
- text: 'Use this check only if BOTH the last payment date AND the breach date are missing from the complaint.
    Show the response for the plaintiff type:'
- text: 'Debt buyer:'
- text: The debt buyer did not include the last payment date or breach date for the account in the complaint.
    The defense in the fourth indented checkbox under “Breach of Contract” may apply. Many people in this
    situation check this defense.
- text: Ask about this checkbox.
- text: 'Original creditor:'
- text: The original creditor did not include the last payment date or breach date for the account in
    the complaint. The defense in the fourth indented checkbox under “Breach of Contract” may apply. Many
    people in this situation check this defense.
- text: Ask about this checkbox.
- text: E Missing statement and ownership proof — debt-buyer cases only
- text: 'If neither the statement nor the document recorded as ownership proof is attached:'
- text: This defense may apply since [PLAINTIFF] did not appear to attach either a statement from [ORIGINAL.CREDITOR]
    or a contract showing they bought the debt. Many people in this situation check this fifth indented
    checkbox under “Breach of Contract” and write in “no proof of plaintiff ownership.”
- text: Ask about this checkbox.
- text: 'If none of the applicable Breach of Contract checks (A-E) match:'
- text: None of the defenses under “Breach of Contract” apply, so they should not be checked.
- text: 'If at least one of the applicable Breach of Contract checks (A-E) match:'
- text: If you believe at least one of the defenses under “Breach of Contract” applies, check off the
    “Breach of Contract” parent box and the main “Failure to State a Cause of Action” box.
- text: Ask about this checkbox.
- text: If Common Counts is also included, continue to “Common Counts checks.” Otherwise continue to “Confirm
    and complete this defense.”
- text: Common Counts checks
- text: A Missing original creditor — debt-buyer cases only
- text: 'If the complaint does not identify the original creditor:'
- text: The debt buyer did not identify the original creditor in the complaint. The defense in the first
    indented checkbox under “Common Counts” may apply. Many people in this situation check this defense.
- text: Ask about this checkbox.
- text: B Missing ownership allegation — either plaintiff type
- text: 'If the complaint does not state that the plaintiff legally owns the debt and has the right to
    sue, show the response for the plaintiff type:'
- text: 'Debt buyer:'
- text: The debt buyer did not state it legally owns the debt and has the right to sue on it in the complaint.
    The defense in the second indented checkbox under “Common Counts” may apply.
- text: Many people in this situation check this defense.
- text: Ask about this checkbox.
- text: 'Original creditor:'
- text: The original creditor did not state it legally owns the debt and has the right to sue on it in
    the complaint. The defense in the second indented checkbox under “Common Counts” may apply.
- text: Many people in this situation check this defense.
- text: Ask about this checkbox.
- text: C Missing statement and ownership proof — debt-buyer cases only
- text: 'If neither the statement nor the document recorded as ownership proof is attached:'
- text: This defense may apply since [PLAINTIFF] did not appear to attach either a statement from [ORIGINAL.CREDITOR]
    or a contract showing they bought the debt.
- text: Many people in this situation check this third indented checkbox under “Common Counts” and write
    in “no proof of plaintiff ownership.”
- text: Ask about this checkbox.
- text: 'If none of the applicable Common Counts checks (A-C) match:'
- text: None of the defenses under “Common Counts” apply, so they should not be checked.
- text: 'If at least one of the applicable Common Counts checks (A-C) match:'
- text: If you believe at least one of the defenses under “Common Counts” applies, check off the “Common
    Counts” parent box and the main “Failure to State a Cause of Action” box.
- text: Ask about this checkbox.
- text: Confirm and complete this defense
- text: Continue to “Confirm selections.”
- text: 5 Mistake
- text: General explanation show to everyone
- text: 'Mistake may apply if there was any error made in the whole process. This includes:'
- text: incorrect late fees
  list_level: 0
  list_format: bullet
- text: more money sued for than owed; or
  list_level: 0
  list_format: bullet
- text: anything that makes you confused about the amount sued
  list_level: 0
