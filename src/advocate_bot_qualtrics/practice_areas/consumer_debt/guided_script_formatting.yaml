- text: 6 Identity Theft
- text: General explanation show to everyone
- text: 'Identity theft happens when someone uses your personal information without your permission to:'
- text: open an account
  list_level: 0
  list_format: bullet
- text: buy things
  list_level: 0
  list_format: bullet
- text: receive services; or
  list_level: 0
  list_format: bullet
- text: take money or property.
  list_level: 0
  list_format: bullet
- text: This defense may apply if [PLAINTIFF] is trying to collect a debt that another person created
    without your permission. For example, someone may have used your personal information to open a credit
    card that you never applied for.
- text: Use the account recognition answer already collected
- text: 'If the user recognizes the account as one they opened:'
- text: You previously said that you opened this account.
- text: This defense does not apply if you recognize the account sued for as yours.
- text: Finish this defense.
- text: 'If the user does not recognize the account as one they opened:'
- text: You said that you do not recognize the account being sued for as one you opened. This could happen
    because [PLAINTIFF] mistakenly sued someone with a similar name, or because someone stole your identity
    to create the account.
- text: This defense only deals with the situation where someone stole your identity.
- text: 'Ask:'
- text: Do you think someone stole your identity to create this debt?
- text: 'If Yes:'
- text: You think someone stole your identity to create this debt. Please raise your hand and ask clinic
    staff to discuss your options with you..
- text: Refer to clinic staff. Do not automatically select this defense.
- text: 'If No:'
- text: You said that you don’t think someone stole your identity to create this debt. This defense does
    not apply.
- text: Finish this defense.
- text: 'If Not sure:'
- text: You said that you’re not sure whether someone stole your identity to create this debt.
- text: Would you like help figuring out whether this account exists because of ID theft?
- text: Continue to Clarify an unresolved answer.
- text: 7 Wrong Party
- text: General explanation show to everyone
- text: Wrong party means [PLAINTIFF] is suing you for a debt that someone else is legally responsible
    for. For example, you may have been confused with someone who has a similar name. Another example
    is being sued for a credit card someone else is responsible for, even if they allowed you to use that
    card. If you signed an agreement with another person to open a joint account, you may be responsible.
- text: Use the account recognition answer already collected
- text: 'If the user recognizes the account as one they opened:'
- text: You said that you recognize the account being sued for as one that you opened.
- text: If you recognize this account as one you opened, this defense does not apply.
- text: Finish this defense.
- text: 'If the user does not recognize the account as one they opened:'
- text: You said that you do not recognize the account being sued for as one that you opened.
- text: 'Ask:'
- text: Did someone else open the account (even if you’ve used the card)?
- text: 'If Yes:'
- text: You said that you’re not responsible for this debt because someone else opened the account. This
    is an important matter which may require further steps.
- text: Please raise your hand and ask clinic staff for help.
- text: Refer to clinic staff. Do not automatically select this defense.
- text: 'If No OR Not sure:'
- text: You’ve indicated that you’re not sure whether the wrong party opened the account.
- text: Do you have further questions on how to determine whether this account belongs to you or not?
- text: Continue to Clarify an unresolved answer.
- text: 8 Laches
- text: General explanation show to everyone
- text: 'Laches may apply if:'
- text: '[PLAINTIFF] waited an unreasonably long time to sue'
  list_level: 0
  list_format: bullet
- text: that delay made it harder for you to defend yourself
  list_level: 0
  list_format: bullet
- text: For example, account records may have been lost or become unavailable while [PLAINTIFF] waited.
- text: The following questions help identify whether the delay made it harder to obtain information about
    your account.
- text: Ask about access to account information
- text: 'Ask:'
- text: Are you locked out of your online portal?
- text: 'Ask:'
- text: Are you reliant only on [PLAINTIFF]’s provided statements (as opposed to having your own copies
    of your account statements)?
- text: 'Ask:'
- text: Would you have difficulty finding information that you used to have about your accounts because
    [PLAINTIFF] waited too long to sue?
- text: 'If the user answers Yes to at least one question:'
- text: 'Laches may apply since waiting to sue made it more difficult for you to find information about
    your account. You said at least one of the following applies:'
- text: You’re locked out of your online portal
  list_level: 0
  list_format: bullet
- text: You’re reliant only on [PLAINTIFF]’s provided account statements
  list_level: 0
  list_format: bullet
- text: You’re having difficulty finding information you used to have about your account
  list_level: 0
  list_format: bullet
- text: Many litigants check off laches, since it is a broad defense.
- text: Ask about this checkbox.
- text: Continue to Confirm selections.
- text: 'If the user answers No to all three questions:'
- text: You did not report difficulty accessing your account records.
- text: Laches does not apply if you did not experience difficulty in finding account information.
- text: Finish this defense.
- text: If an answer remains unresolved and there is no Yes answer
- text: Clarify an unresolved answer.
- text: 9 Fraud Misrepresentation and Concealment
- text: General explanation show to everyone
- text: Fraud, misrepresentation, and concealment involve being misled about important facts related to
    the debt, by any party.
- text: For example, a creditor may have misled you about fees or penalties, and you agreed to the account
    or made payments based on that information.
- text: Another example is if someone else opened the account by stealing your identity.
