# Source: Decision Tree Draft 9_24_2026.docx, PRELIM-01 followed by AFF-01.
# Outcomes and clinic referrals are recorded by the assess_* action handlers.
id: consumer_debt_interactive
version: "2.1"
start_node_id: get_plaintiff_name
nodes:
  - id: get_plaintiff_name
    kind: input
    question: "Who is suing you? Enter the plaintiff's name shown on the complaint."
    input: {field: plaintiff_name, type: text, valid_branch_id: submit, unknown_branch_id: unknown}
    idk_skip_branch_id: unknown
    branches:
      - {id: submit, label: "Value supplied.", target: prelim_creditor_type}
      - {id: unknown, label: "I do not know.", target: prelim_creditor_type}
  - id: prelim_creditor_type
    kind: choice
    question: "Is that plaintiff the original creditor or a debt buyer? [PLAINTIFF]"
    idk_skip_branch_id: unknown
    branches:
      - {id: original, label: "Original creditor.", target: prelim_recognize}
      - {id: buyer, label: "Debt buyer.", target: prelim_recognize}
      - {id: unknown, label: "I do not know.", target: prelim_recognize}
  - id: prelim_recognize
    kind: choice
    question: "Do you recognize the account being sued over as one you opened? [RECOGNIZE]"
    idk_skip_branch_id: unknown
    branches:
      - {id: yes, label: "Yes.", target: prelim_law_firm}
      - {id: no, label: "No.", target: prelim_law_firm}
      - {id: unknown, label: "I do not know.", target: prelim_law_firm}
  - id: prelim_law_firm
    kind: input
    question: "Which law firm has the plaintiff hired?"
    input: {field: law_firm, type: text, valid_branch_id: submit, unknown_branch_id: unknown}
    idk_skip_branch_id: unknown
    branches:
      - {id: submit, label: "Value supplied.", target: prelim_suit_type}
      - {id: unknown, label: "I do not know.", target: prelim_suit_type}
  - id: prelim_suit_type
    kind: choice
    question: "Does the complaint state breach of contract, common counts, or both? [SUIT-TYPE]"
    idk_skip_branch_id: unknown
    branches:
      - {id: breach, label: "Breach of contract.", target: prelim_oral}
      - {id: common, label: "Common counts.", target: prelim_oral}
      - {id: both, label: "Both breach of contract and common counts.", target: prelim_oral}
      - {id: missing, label: "Neither is stated in the complaint.", target: prelim_oral}
      - {id: unknown, label: "I do not know.", target: prelim_oral}
  - id: prelim_oral
    kind: choice
    question: "Did you open this account only by talking to the original creditor, with no written agreement? [ORAL]"
    idk_skip_branch_id: unknown
    branches:
      - {id: yes, label: "Yes.", target: get_amount_sued}
      - {id: no, label: "No.", target: get_amount_sued}
      - {id: unknown, label: "I do not know.", target: get_amount_sued}
  - id: get_amount_sued
    kind: input
    question: "According to the complaint, how much do you owe? [AMOUNT]"
    input: {field: amount_sued, type: currency, valid_branch_id: submit, unknown_branch_id: unknown}
    idk_skip_branch_id: unknown
    branches:
      - {id: submit, label: "Value supplied.", target: prelim_amount_agree}
      - {id: missing, label: "The complaint does not include this information.", target: prelim_last_payment}
      - {id: unknown, label: "I do not know.", target: prelim_last_payment}
  - id: prelim_amount_agree
    kind: choice
    question: "The complaint amount you entered is {amount_sued}. Do you agree that you owe this amount?"
    idk_skip_branch_id: unknown
    branches:
      - {id: yes, label: "Yes.", target: prelim_last_payment}
      - {id: no, label: "No.", target: prelim_correct_amount}
      - {id: unknown, label: "I do not know.", target: prelim_last_payment}
  - id: prelim_correct_amount
    kind: input
    question: "What amount do you believe you owe? This will replace the complaint amount for later questions."
    input: {field: amount_sued, type: currency, valid_branch_id: submit, unknown_branch_id: unknown}
    idk_skip_branch_id: unknown
    branches:
      - {id: submit, label: "Value supplied.", target: prelim_last_payment}
      - {id: unknown, label: "I do not know.", target: prelim_last_payment}
  - id: prelim_last_payment
    kind: input
    question: "According to the complaint, when was the last date of payment? If it is not stated, choose missing. [LAST-PAYMENT-DATE]"
    input: {field: last_payment_complaint, type: date, valid_branch_id: submit, unknown_branch_id: no_date}
    idk_skip_branch_id: no_date
    branches:
      - {id: submit, label: "Value supplied.", target: prelim_payment_agree}
      - {id: missing, label: "The complaint does not include this information.", target: prelim_open_date}
      - {id: no_date, label: "I do not know.", target: prelim_open_date}
  - id: prelim_payment_agree
    kind: choice
    question: "The complaint's last payment date you entered is {date_user_failed_to_pay}. Do you agree with this date?"
    idk_skip_branch_id: unknown
    branches:
      - {id: yes, label: "Yes.", target: prelim_open_date}
      - {id: no, label: "No.", target: prelim_correct_payment}
      - {id: unknown, label: "I do not know.", target: prelim_open_date}
  - id: prelim_correct_payment
    kind: input
    question: "When did you actually last make a payment? This will replace the complaint's last payment date for later questions. Include partial payments."
    input: {field: last_payment_complaint, type: date, valid_branch_id: submit, unknown_branch_id: no_date}
    idk_skip_branch_id: no_date
    branches:
      - {id: submit, label: "Value supplied.", target: prelim_open_date}
      - {id: no_date, label: "I do not know.", target: prelim_open_date}
  - id: prelim_open_date
    kind: input
    question: "According to the complaint, when was the account opened? If it is not stated, choose missing. [OPEN-DATE]"
    input: {field: open_date, type: date, valid_branch_id: submit, unknown_branch_id: no_date}
    idk_skip_branch_id: no_date
    branches:
      - {id: submit, label: "Value supplied.", target: prelim_open_agree}
      - {id: missing, label: "The complaint does not include this information.", target: prelim_statement}
      - {id: no_date, label: "I do not know.", target: prelim_statement}
  - id: prelim_open_agree
    kind: choice
    question: "The complaint's account opening date you entered is {open_date}. Do you agree with this date?"
    idk_skip_branch_id: unknown
    branches:
      - {id: yes, label: "Yes.", target: prelim_statement}
      - {id: no, label: "No.", target: prelim_correct_open_date}
      - {id: unknown, label: "I do not know.", target: prelim_statement}
  - id: prelim_correct_open_date
    kind: input
    question: "When did you actually open the account? This will replace the complaint's opening date for later questions."
    input: {field: open_date, type: date, valid_branch_id: submit, unknown_branch_id: no_date}
    idk_skip_branch_id: no_date
    branches:
      - {id: submit, label: "Value supplied.", target: prelim_statement}
      - {id: no_date, label: "I do not know.", target: prelim_statement}
  - id: prelim_statement
    kind: choice
    question: "Does the complaint have a final credit card statement attached? [STATEMENT]"
    idk_skip_branch_id: unknown
    branches:
      - {id: yes, label: "Yes.", target: prelim_ownership}
      - {id: no, label: "No.", target: prelim_ownership}
      - {id: unknown, label: "I do not know.", target: prelim_ownership}
  - id: prelim_ownership
    kind: choice
    question: "Does the complaint have a credit card agreement attached (for an original creditor), or a specific debt transfer contract or last statement showing the charge-off date (for a debt buyer)? [OWNERSHIP]"
    idk_skip_branch_id: unknown
    branches:
      - {id: yes, label: "Yes.", target: prelim_verified}
      - {id: no, label: "No.", target: prelim_verified}
      - {id: unknown, label: "I do not know.", target: prelim_verified}
  - id: prelim_verified
    kind: choice
    question: "Is the complaint verified by a lawyer signing under penalty of perjury? [VERIFIED]"
    idk_skip_branch_id: unknown
    branches:
      - {id: yes, label: "Yes.", target: prelim_consolidation}
      - {id: no, label: "No.", target: prelim_consolidation}
      - {id: unknown, label: "I do not know.", target: prelim_consolidation}
  - id: prelim_consolidation
    kind: choice
    question: "Are you working with a debt consolidation company? [CONSOLIDATION]"
    idk_skip_branch_id: unknown
    branches:
      - {id: yes, label: "Yes.", target: sol_creditor_type}
      - {id: no, label: "No.", target: sol_creditor_type}
      - {id: unknown, label: "I do not know.", target: sol_creditor_type}
  - id: sol_creditor_type
    kind: choice
    question: "Statute of limitations: is the plaintiff the original creditor or a debt buyer?"
    idk_skip_branch_id: unknown
    branches:
      - {"id":"original","label":"Original creditor.","target":"get_filing_date"}
      - {"id":"buyer","label":"Debt buyer.","target":"sol_buyer_payment"}
      - {"id":"unknown","label":"I do not know.","target":"statute_of_limitations_result"}
  - id: sol_buyer_payment
    kind: choice
    question: "Have you made a payment to the debt buyer?"
    idk_skip_branch_id: unknown
    branches:
      - {"id":"yes","label":"Yes.","target":"get_filing_date"}
      - {"id":"no","label":"No.","target":"statute_of_limitations_result"}
      - {"id":"unknown","label":"I do not know.","target":"statute_of_limitations_result"}
  - id: get_filing_date
    kind: input
    question: "What is the complaint's filing date? Use the filing date, not the date you received it."
    input: {"field":"filing_date","type":"date","valid_branch_id":"submit","unknown_branch_id":"no_date"}
    idk_skip_branch_id: no_date
    branches:
      - {id: submit, label: "Date supplied.", target: sol_payment_recipient}
      - {id: no_date, label: "I do not know the date.", target: sol_payment_recipient}
  - id: sol_payment_recipient
    kind: choice
    question: "Is the plaintiff the original creditor or a debt buyer? [PLAINTIFF]"
    idk_skip_branch_id: unknown
    branches:
      - {id: original, label: "Original creditor.", target: get_last_payment_complaint}
      - {id: buyer, label: "Debt buyer.", target: get_last_payment_debt_collector}
      - {id: unknown, label: "I do not know.", target: statute_of_limitations_result}
  - id: get_last_payment_debt_collector
    kind: input
    question: "When did you last make a payment specifically to the debt buyer? Include partial payments."
    input: {field: last_payment_debt_collector, type: date, valid_branch_id: submit, unknown_branch_id: no_date}
    idk_skip_branch_id: no_date
    branches:
      - {id: submit, label: "Date supplied.", target: sol_contract}
      - {id: no_date, label: "I do not know the date.", target: sol_contract}
  - id: get_last_payment_complaint
    kind: input
    question: "When did you last make a payment to {payment_recipient}? Include partial payments, no matter how small."
    input: {"field":"last_payment_complaint","type":"date","valid_branch_id":"submit","unknown_branch_id":"no_date"}
    idk_skip_branch_id: no_date
    branches:
      - {"id":"submit","label":"Date supplied.","target":"sol_contract"}
      - {"id":"no_date","label":"I do not know the date.","target":"sol_contract"}
  - id: sol_contract
    kind: choice
    question: "Was the account agreement oral (no written agreement) or written?"
    idk_skip_branch_id: unknown
    branches:
      - {"id":"oral","label":"Oral agreement.","target":"statute_of_limitations_result"}
      - {"id":"written","label":"Written agreement.","target":"sol_state_law"}
      - {"id":"unknown","label":"I do not know.","target":"statute_of_limitations_result"}
  - id: sol_state_law
    kind: choice
    question: "Clinic staff need to read the credit card agreement to determine which state's law applies. Which law have clinic staff confirmed? If it has not been confirmed, choose unknown; we will flag it for clinic review and continue."
    idk_skip_branch_id: unknown
    branches:
      - {"id":"ca","label":"Clinic staff confirmed California (4 years).","target":"statute_of_limitations_result"}
      - {"id":"de","label":"Clinic staff confirmed Delaware (3 years).","target":"statute_of_limitations_result"}
      - {"id":"other","label":"Clinic staff identified another state; its cutoff needs review.","target":"statute_of_limitations_result"}
      - {"id":"unknown","label":"Clinic staff have not determined the applicable law.","target":"statute_of_limitations_result"}
  - id: statute_of_limitations_result
    kind: action
    question: "Recording the statute of limitations screening result."
    action: assess_statute_of_limitations
    next: ambiguity
  - id: ambiguity
    kind: choice
    question: "Are you at all confused about the suit, the amount sued for, or what the charges are?"
    idk_skip_branch_id: unknown
    branches:
      - {"id":"yes","label":"Yes.","target":"ambiguity_result"}
      - {"id":"no","label":"No.","target":"ambiguity_result"}
      - {"id":"unknown","label":"I do not know.","target":"ambiguity_result"}
  - id: ambiguity_result
    kind: action
    question: "Recording the ambiguity screening result."
    action: assess_ambiguity
    next: standing_creditor_type
  - id: standing_creditor_type
    kind: choice
    question: "Standing/privity: is the plaintiff the original creditor or a debt buyer?"
    idk_skip_branch_id: unknown
    branches:
      - {"id":"original","label":"Original creditor.","target":"standing_claim"}
      - {"id":"buyer","label":"Debt buyer.","target":"standing_privity_result"}
      - {"id":"unknown","label":"I do not know.","target":"standing_privity_result"}
  - id: standing_claim
    kind: choice
    question: "Did the plaintiff state that it is the legal owner of this debt and has the right to bring a case to collect it?"
    idk_skip_branch_id: unknown
    branches:
      - {"id":"yes","label":"Yes.","target":"standing_agreement"}
      - {"id":"no","label":"No.","target":"standing_agreement"}
      - {"id":"unknown","label":"I do not know.","target":"standing_agreement"}
  - id: standing_agreement
    kind: choice
    question: "Did the plaintiff provide a copy of the agreement showing legal ownership of the debt and the right to bring the case?"
    idk_skip_branch_id: unknown
    branches:
      - {"id":"yes","label":"Yes.","target":"standing_privity_result"}
      - {"id":"no","label":"No.","target":"standing_privity_result"}
      - {"id":"unknown","label":"I do not know.","target":"standing_privity_result"}
  - id: standing_privity_result
    kind: action
    question: "Recording the standing privity screening result."
    action: assess_standing_privity
    next: cause_creditor_type
  - id: cause_creditor_type
    kind: choice
    question: "Failure to state a cause of action: is the plaintiff the original creditor or a debt buyer?"
    idk_skip_branch_id: unknown
    branches:
      - {"id":"original","label":"Original creditor.","target":"cause_original_owner"}
      - {"id":"buyer","label":"Debt buyer.","target":"cause_statement"}
      - {"id":"unknown","label":"I do not know.","target":"failure_to_state_cause_result"}
  - id: cause_statement
    kind: choice
    question: "Does the complaint have a credit card statement attached that identifies the original creditor?"
    idk_skip_branch_id: unknown
    branches:
      - {"id":"yes","label":"Yes.","target":"cause_purchase_claim"}
      - {"id":"no","label":"No.","target":"cause_purchase_claim"}
      - {"id":"unknown","label":"I do not know.","target":"cause_purchase_claim"}
  - id: cause_purchase_claim
    kind: choice
    question: "Did the plaintiff say it bought the debt?"
    idk_skip_branch_id: unknown
    branches:
      - {"id":"yes","label":"Yes.","target":"cause_purchase_documents"}
      - {"id":"no","label":"No.","target":"cause_purchase_documents"}
      - {"id":"unknown","label":"I do not know.","target":"cause_purchase_documents"}
  - id: cause_purchase_documents
    kind: choice
    question: "Does the complaint include documents showing the plaintiff bought the debt, or a final statement showing charge-off?"
    idk_skip_branch_id: unknown
    branches:
      - {"id":"yes","label":"Yes.","target":"cause_breach_contract"}
      - {"id":"no","label":"No.","target":"cause_breach_contract"}
      - {"id":"unknown","label":"I do not know.","target":"cause_breach_contract"}
  - id: cause_breach_contract
    kind: choice
    question: "Does the complaint assert breach of contract?"
    idk_skip_branch_id: unknown
    branches:
      - {"id":"yes","label":"Yes.","target":"cause_open_date"}
      - {"id":"no","label":"No.","target":"failure_to_state_cause_result"}
      - {"id":"unknown","label":"I do not know.","target":"failure_to_state_cause_result"}
  - id: cause_original_owner
    kind: choice
    question: "Does the complaint state that the original creditor is the legal owner of the debt?"
    idk_skip_branch_id: unknown
    branches:
      - {"id":"yes","label":"Yes.","target":"cause_open_date"}
      - {"id":"no","label":"No.","target":"cause_open_date"}
      - {"id":"unknown","label":"I do not know.","target":"cause_open_date"}
  - id: cause_open_date
    kind: choice
    question: "Does the complaint include the date the contract was entered into?"
    idk_skip_branch_id: unknown
    branches:
      - {"id":"yes","label":"Yes.","target":"cause_breach_date"}
      - {"id":"no","label":"No.","target":"cause_breach_date"}
      - {"id":"unknown","label":"I do not know.","target":"cause_breach_date"}
  - id: cause_breach_date
    kind: choice
    question: "Does the complaint include the date of the contract breach?"
    idk_skip_branch_id: unknown
    branches:
      - {"id":"yes","label":"Yes.","target":"failure_to_state_cause_result"}
      - {"id":"no","label":"No.","target":"failure_to_state_cause_result"}
      - {"id":"unknown","label":"I do not know.","target":"failure_to_state_cause_result"}
  - id: failure_to_state_cause_result
    kind: action
    question: "Recording the failure to state cause screening result."
    action: assess_failure_to_state_cause
    next: mistake
  - id: mistake
    kind: choice
    question: "Was there any error in the process, such as an incorrect late fee, more money sued for than owed, or anything that makes you confused about the amount sued for?"
    idk_skip_branch_id: unknown
    branches:
      - {"id":"yes","label":"Yes.","target":"mistake_result"}
      - {"id":"no","label":"No.","target":"mistake_result"}
      - {"id":"unknown","label":"I do not know.","target":"mistake_result"}
  - id: mistake_result
    kind: action
    question: "Recording the mistake screening result."
    action: assess_mistake
    next: identity_recognize
  - id: identity_recognize
    kind: choice
    question: "Identity theft: do you recognize the account being sued over as one you opened?"
    idk_skip_branch_id: unknown
    branches:
      - {"id":"yes","label":"Yes.","target":"identity_theft_result"}
      - {"id":"no","label":"No.","target":"identity_suspected"}
      - {"id":"unknown","label":"I do not know.","target":"identity_theft_result"}
  - id: identity_suspected
    kind: choice
    question: "Do you think someone stole your identity to create this debt?"
    idk_skip_branch_id: unknown
    branches:
      - {"id":"yes","label":"Yes.","target":"identity_theft_result"}
      - {"id":"no","label":"No.","target":"identity_theft_result"}
      - {"id":"unknown","label":"I do not know.","target":"identity_theft_result"}
  - id: identity_theft_result
    kind: action
    question: "Recording the identity theft screening result."
    action: assess_identity_theft
    next: wrong_party_recognize
  - id: wrong_party_recognize
    kind: choice
    question: "Wrong party: do you recognize the account being sued over as one you opened?"
    idk_skip_branch_id: unknown
    branches:
      - {"id":"yes","label":"Yes.","target":"wrong_party_result"}
      - {"id":"no","label":"No.","target":"wrong_party_owner"}
      - {"id":"unknown","label":"I do not know.","target":"wrong_party_result"}
  - id: wrong_party_owner
    kind: choice
    question: "Does someone else own the card and bear financial responsibility, even if you used the card?"
    idk_skip_branch_id: unknown
    branches:
      - {"id":"yes","label":"Yes.","target":"wrong_party_result"}
      - {"id":"no","label":"No.","target":"wrong_party_result"}
      - {"id":"unknown","label":"I do not know.","target":"wrong_party_result"}
  - id: wrong_party_result
    kind: action
    question: "Recording the wrong party screening result."
    action: assess_wrong_party
    next: laches
  - id: laches
    kind: choice
    question: "Do any of these apply: you are locked out of your online account portal; you lack your own account statements and rely only on statements from the bank or debt collector; or you have difficulty finding account information you previously had?"
    idk_skip_branch_id: unknown
    branches:
      - {"id":"yes","label":"Yes.","target":"laches_result"}
      - {"id":"no","label":"No.","target":"laches_result"}
      - {"id":"unknown","label":"I do not know.","target":"laches_result"}
  - id: laches_result
    kind: action
    question: "Recording the laches screening result."
    action: assess_laches
    next: fraud_identity
  - id: fraud_identity
    kind: choice
    question: "Fraud, misrepresentation, or concealment: do you think someone stole your identity to create this debt?"
    idk_skip_branch_id: unknown
    branches:
      - {"id":"yes","label":"Yes.","target":"fraud_hidden_facts"}
      - {"id":"no","label":"No.","target":"fraud_hidden_facts"}
      - {"id":"unknown","label":"I do not know.","target":"fraud_hidden_facts"}
  - id: fraud_hidden_facts
    kind: choice
    question: "Did the plaintiff or original creditor lie or hide important facts about your account, such as late penalties?"
    idk_skip_branch_id: unknown
    branches:
      - {"id":"yes","label":"Yes.","target":"fraud_result"}
      - {"id":"no","label":"No.","target":"fraud_result"}
      - {"id":"unknown","label":"I do not know.","target":"fraud_result"}
  - id: fraud_result
    kind: action
    question: "Recording the fraud screening result."
    action: assess_fraud
    next: mitigation_consolidation
  - id: mitigation_consolidation
    kind: choice
    question: "Are you working with a debt consolidation company?"
    idk_skip_branch_id: unknown
    branches:
      - {"id":"yes","label":"Yes.","target":"mitigation_contact"}
      - {"id":"no","label":"No.","target":"mitigation_contact"}
      - {"id":"unknown","label":"I do not know.","target":"mitigation_contact"}
  - id: mitigation_contact
    kind: choice
    question: "Did the plaintiff try to call or email {negotiation_party} to set up a payment plan or agreement before suing?"
    idk_skip_branch_id: unknown
    branches:
      - {"id":"yes","label":"Yes.","target":"mitigation_settlement"}
      - {"id":"no","label":"No.","target":"mitigation_settlement"}
      - {"id":"unknown","label":"I do not know.","target":"mitigation_settlement"}
  - id: mitigation_settlement
    kind: choice
    question: "Did the plaintiff sue after declining a settlement offer made by {negotiation_party}? Answer yes only if you know this happened."
    idk_skip_branch_id: unknown
    branches:
      - {"id":"yes","label":"Yes.","target":"failure_to_mitigate_result"}
      - {"id":"no","label":"No.","target":"failure_to_mitigate_result"}
      - {"id":"unknown","label":"I do not know.","target":"failure_to_mitigate_result"}
  - id: failure_to_mitigate_result
    kind: action
    question: "Recording the failure to mitigate screening result."
    action: assess_failure_to_mitigate
    next: common_counts_claim
  - id: common_counts_claim
    kind: choice
    question: "Does the complaint assert a common-count claim (including a complaint that also asserts breach of contract)?"
    idk_skip_branch_id: unknown
    branches:
      - {"id":"yes","label":"Yes.","target":"common_counts_reasons"}
      - {"id":"no","label":"No.","target":"common_counts_result"}
      - {"id":"unknown","label":"I do not know.","target":"common_counts_result"}
  - id: common_counts_reasons
    kind: choice
    question: "Do any of these apply: the plaintiff failed to credit payments; agreed to accept a lower payment but now asks for more than agreed; failed to make payments under an insurance plan you purchased; someone stole your identity to create this debt; or part of the transaction resulted from fraud, misrepresentation, or concealment?"
    idk_skip_branch_id: unknown
    branches:
      - {"id":"yes","label":"Yes.","target":"common_counts_result"}
      - {"id":"no","label":"No.","target":"common_counts_result"}
      - {"id":"unknown","label":"I do not know.","target":"common_counts_result"}
  - id: common_counts_result
    kind: action
    question: "Recording the common counts screening result."
    action: assess_common_counts
    next: unconscionable_contract
  - id: unconscionable_contract
    kind: choice
    question: "Do you think the terms of your account or the way the plaintiff handled the account was unfair?"
    idk_skip_branch_id: unknown
    branches:
      - {"id":"yes","label":"Yes.","target":"unconscionable_contract_result"}
      - {"id":"no","label":"No.","target":"unconscionable_contract_result"}
      - {"id":"unknown","label":"I do not know.","target":"unconscionable_contract_result"}
  - id: unconscionable_contract_result
    kind: action
    question: "Recording the unconscionable contract screening result."
    action: assess_unconscionable_contract
    next: rescission
  - id: rescission
    kind: choice
    question: "Did the original creditor refuse a request by {negotiation_party} to close the account before you stopped making payments?"
    idk_skip_branch_id: unknown
    branches:
      - {"id":"yes","label":"Yes.","target":"rescission_result"}
      - {"id":"no","label":"No.","target":"rescission_result"}
