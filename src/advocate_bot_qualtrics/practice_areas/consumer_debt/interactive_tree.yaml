    question: 'The complaint was read as follows for attached ownership documents: {parsed_value}. Do
      you agree with this value?'
    explanation:
      show_with_question: true
      blocks:
        - text: Proof of ownership consists of documents supporting the plaintiff’s claimed ownership
            or right to collect, attached to the complaint. Flip to the exhibits and attachments after
            the main complaint form.
        - text: Look for an “assignment,” “bill of sale,” or purchase agreement, along with a schedule
            or account record which shows that [PLAINTIFF] purchased your debt from [ORIGINAL.CREDITOR]
            or another company. A document about the sale of many accounts (from other consumers with
            debt) may count. A final account statement can help identify the account, but does not necessarily
            show a transfer to [PLAINTIFF].
          creditor_type: buyer
        - text: Look for an account agreement and records (like account statements) connecting your account
            to [PLAINTIFF].
          creditor_type: original
    idk_skip_branch_id: unknown
    branches:
