    explanation:
      text: Statute of limitations is a rule that says if [PLAINTIFF] waits too long, they cannot sue
        you. The maximum length of time they can wait varies from 2 to 6 years, depending on which state’s
        law applies. But this defense may be preserved in an answer if [PLAINTIFF] files a complaint more
        than or equal to a year after your last payment.
