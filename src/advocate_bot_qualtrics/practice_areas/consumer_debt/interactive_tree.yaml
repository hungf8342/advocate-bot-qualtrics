id: consumer_debt_interactive
version: "1.2"
start_node_id: get_plaintiff_name
nodes:
  - id: get_plaintiff_name
    kind: input
    question: "To begin, who is suing you? Please enter the plaintiff name shown on the complaint."
    input: {field: plaintiff_name, type: text, valid_branch_id: submit, unknown_branch_id: unknown}
    idk_skip_branch_id: unknown
    branches:
      - {id: submit, label: "Plaintiff name supplied.", target: get_amount_sued}
      - {id: unknown, label: "I do not know who is suing me.", target: get_amount_sued}
  - id: get_amount_sued
    kind: input
    question: "How much does the complaint say you are being sued for? Please enter the amount, if known."
    input: {field: amount_sued, type: currency, valid_branch_id: submit, unknown_branch_id: unknown}
    idk_skip_branch_id: unknown
    branches:
      - {id: submit, label: "Amount supplied.", target: get_filing_date}
      - {id: unknown, label: "I do not know the amount.", target: get_filing_date}
  - id: get_filing_date
    kind: input
    question: "When was the complaint dated or filed? Please enter the date shown on the complaint."
    input: {field: filing_date, type: date, valid_branch_id: submit, unknown_branch_id: no_date}
    idk_skip_branch_id: no_date
    branches:
      - {id: submit, label: "Date supplied.", target: get_last_payment_complaint}
      - {id: no_date, label: "I do not know the date.", target: get_last_payment_complaint}
  - id: get_last_payment_complaint
    kind: input
    question: "What was the last time you made a payment to the original creditor or a third-party debt collector? This includes partial payments, no matter how small."
    input: {field: last_payment_complaint, type: date, valid_branch_id: submit, unknown_branch_id: no_date}
    idk_skip_branch_id: no_date
    branches:
      - {id: submit, label: "Date supplied.", target: sol_computation}
      - {id: no_date, label: "I do not know the date.", target: sol_computation}
  - id: sol_computation
    kind: action
    action: sol_computation
    question: "Computing the statute-of-limitations screening result from the dates you provided."
    next: threatening_arrest
  - id: threatening_arrest
    kind: choice
    question: "Did the debt collector threaten that you could be arrested for not paying this debt?"
    idk_skip_branch_id: no
    branches:
      - {id: yes, label: "Yes.", target: contact_third_parties}
      - {id: no, label: "No or I do not know.", target: contact_third_parties}
  - id: contact_third_parties
    kind: choice
    question: "Did the debt collector disclose your debt to family, friends, or other third parties without your permission?"
    idk_skip_branch_id: no
    branches:
      - {id: yes, label: "Yes.", target: record_bad_behavior}
      - {id: no, label: "No or I do not know.", target: record_bad_behavior}
  - id: record_bad_behavior
    kind: choice
    question: "Do you have written or recorded evidence of that behavior?"
    idk_skip_branch_id: no
    branches:
      - {id: yes, label: "Yes.", target: fdcpa_computation}
      - {id: no, label: "No or I do not know.", target: fdcpa_computation}
  - id: fdcpa_computation
    kind: action
    action: fdcpa_computation
    question: "Computing the FDCPA screening result from the answers you provided."
    next: review_questions
  - id: review_questions
    kind: terminal
    terminal_qa: true
    question: "Do you have any questions before we summarize next steps?"
    branches: []
