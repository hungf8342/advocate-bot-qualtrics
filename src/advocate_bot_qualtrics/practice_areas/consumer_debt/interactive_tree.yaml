# Governing sources: October 11 preliminary intake; October 25 defense conversation scripts.
# Checkbox choices are explicit; finish paths advance without offering a checkbox.
id: consumer_debt_interactive
version: '2026.10.25'
start_node_id: verify_case_number
nodes:
  - id: verify_case_number
    kind: choice
    question: 'The complaint was read as follows for case number: {parsed_value}. Do you agree with this
      value?'
    explanation:
      show_with_question: true
      text: The case number is the court-assigned number for identifying the case. It prominently appears
        in the top right quadrant of the complaint’s first page.
    idk_skip_branch_id: unknown
    branches:
      - id: 'yes'
        label: Yes, I agree.
        target: verify_plaintiff
      - id: 'no'
        label: No, I want to provide a different value.
        target: prelim_case_number
      - id: unknown
        label: I am not sure.
        target: verify_plaintiff
    title: Case Number
  - id: prelim_case_number
    kind: input
    question: What is the case number?
    input:
      field: case_number
      type: text
      valid_branch_id: submit
      unknown_branch_id: unknown
    idk_skip_branch_id: unknown
    branches:
      - id: submit
        label: Value supplied.
        target: verify_plaintiff
      - id: missing
        label: Not stated in the complaint.
        target: verify_plaintiff
      - id: unknown
        label: I am not sure.
        target: verify_plaintiff
    explanation:
      show_with_question: false
      text: The case number is the court-assigned number for identifying the case. It prominently appears
        in the top right quadrant of the complaint’s first page.
    title: Case Number
  - id: verify_plaintiff
    kind: choice
    question: 'The complaint was read as follows for plaintiff''s name: {parsed_value}. Do you agree with
      this value?'
    explanation:
      show_with_question: true
      text: The plaintiff is who is suing you for money. You can find the plaintiff name on the first
        page of the complaint, almost always in the top half of the page.
      images:
        - path: complaint-examples/plaintiff.png
          alt: Example complaint with the plaintiff name highlighted
    idk_skip_branch_id: unknown
    branches:
      - id: 'yes'
        label: Yes, I agree.
        target: verify_creditor_type
      - id: 'no'
        label: No, I want to provide a different value.
        target: get_plaintiff_name
      - id: unknown
        label: I am not sure.
        target: verify_creditor_type
    title: Plaintiff
  - id: get_plaintiff_name
    kind: input
    question: Who is suing?
    input:
      field: plaintiff_name
      type: text
      valid_branch_id: submit
      unknown_branch_id: unknown
    idk_skip_branch_id: unknown
    branches:
      - id: submit
        label: Value supplied.
        target: verify_creditor_type
      - id: missing
        label: Not stated in the complaint.
        target: verify_creditor_type
      - id: unknown
        label: I do not know.
        target: verify_creditor_type
    explanation:
      show_with_question: false
      text: The plaintiff is who is suing you for money. You can find the plaintiff name on the first
        page of the complaint, almost always in the top half of the page.
      images:
        - path: complaint-examples/plaintiff.png
          alt: Example complaint with the plaintiff name highlighted
    title: Plaintiff
  - id: verify_creditor_type
    kind: choice
    question: 'The complaint was read as follows for plaintiff type: {parsed_value}. Do you agree with
      this value?'
    explanation:
      show_with_question: true
      text: An "original creditor" is the company you originally owed the debt to — for example, the bank
        or credit card company whose card you used. A "debt buyer" is a company that purchases old or
        unpaid debts from original creditors (often for pennies on the dollar) and then tries to collect
        on them. Companies like Cavalry SPV, Midland Credit Management, and Portfolio Recovery Associates
        are typically debt buyers.
    idk_skip_branch_id: unknown
    branches:
      - id: 'yes'
        label: Yes, I agree.
        target: prelim_original_creditor_needed
      - id: 'no'
        label: No, I want to provide a different value.
        target: prelim_creditor_type
      - id: unknown
        label: I am not sure.
        target: prelim_original_creditor_needed
    title: Plaintiff Type
  - id: prelim_creditor_type
    kind: choice
    question: Is the plaintiff an original creditor or debt buyer?
    validation:
      type: enum
      categories:
        original: The user says this is the company that originally extended the credit or first owned
          the account.
        buyer: The user says this company bought or was assigned the debt from the original creditor.
        unknown: The user is unsure, gives only a company name without saying whether it bought the debt,
          or provides insufficient or conflicting information.
    idk_skip_branch_id: unknown
    branches:
      - id: original
        label: Original creditor.
        target: prelim_original_creditor_needed
      - id: buyer
        label: Debt buyer.
        target: prelim_original_creditor_needed
      - id: unknown
        label: Not sure.
        target: prelim_original_creditor_needed
    explanation:
      show_with_question: false
      text: An "original creditor" is the company you originally owed the debt to — for example, the bank
        or credit card company whose card you used. A "debt buyer" is a company that purchases old or
        unpaid debts from original creditors (often for pennies on the dollar) and then tries to collect
        on them. Companies like Cavalry SPV, Midland Credit Management, and Portfolio Recovery Associates
        are typically debt buyers.
    title: Plaintiff Type
  - id: prelim_original_creditor_needed
    kind: condition
    question: ''
    branches:
      - id: buyer
        label: Debt buyer.
        target: verify_original_creditor
      - id: original
        label: Original creditor.
        target: prelim_recognize
      - id: unknown
        label: Not sure.
        target: verify_original_creditor
  - id: verify_original_creditor
    kind: choice
    question: 'The complaint was read as follows for original creditor: {parsed_value}. Do you agree with
      this value?'
    explanation:
      show_with_question: true
      text: The original creditor is the company you first owed the debt to, before it was sold or transferred
        to another company. For a credit card, this is usually the bank that issued the card, which may
        be different from the store or brand printed on it. Look in the complaint’s numbered paragraphs
        for “original creditor,” “original issuer,” or “charge-off creditor,” and check any attached account
        statements. A charge-off creditor is the company that held the account when it recorded the unpaid
        balance as a loss; it is not always the original creditor. Your older statements or account agreement
        may help you confirm the name.
    idk_skip_branch_id: unknown
    branches:
      - id: 'yes'
        label: Yes, I agree.
        target: prelim_recognize
      - id: 'no'
        label: No, I want to provide a different value.
        target: prelim_original_creditor
      - id: unknown
        label: I am not sure.
        target: prelim_recognize
    title: Original Creditor
  - id: prelim_original_creditor
    kind: input
    question: If a debt buyer is suing, who is the original creditor?
    input:
      field: original_creditor
      type: text
      valid_branch_id: submit
      unknown_branch_id: unknown
    idk_skip_branch_id: unknown
    branches:
      - id: submit
        label: Value supplied.
        target: prelim_recognize
      - id: missing
        label: Not stated in the complaint.
        target: prelim_recognize
      - id: unknown
        label: I am not sure.
        target: prelim_recognize
    explanation:
      show_with_question: false
      text: The original creditor is the company you first owed the debt to, before it was sold or transferred
        to another company. For a credit card, this is usually the bank that issued the card, which may
        be different from the store or brand printed on it. Look in the complaint’s numbered paragraphs
        for “original creditor,” “original issuer,” or “charge-off creditor,” and check any attached account
        statements. A charge-off creditor is the company that held the account when it recorded the unpaid
        balance as a loss; it is not always the original creditor. Your older statements or account agreement
        may help you confirm the name.
    title: Original Creditor
  - id: prelim_recognize
    kind: choice
    question: Do you recognize this account as one you opened?
    idk_skip_branch_id: unknown
    branches:
      - id: 'yes'
        label: Yes.
        target: verify_law_firm
      - id: 'no'
        label: No.
        target: verify_law_firm
      - id: unknown
        label: I do not know.
        target: verify_law_firm
    explanation:
      show_with_question: true
      text: To determine if the plaintiff can sue you, check if you recognize the account in the complaint
        as one you opened. Look for the original creditor’s name, the account number or its last few digits,
        and any attached statements showing your name or purchases. Compare those details with your own
        memory or records. You may recognize the account as yours even if you do not recognize the debt
        buyer suing you. Recognizing the account does not mean you agree with the amount claimed. Using
        someone else’s card is also different from opening an account yourself. If the details are too
        limited to tell, you can say you are not sure.
    title: Account Recognition
  - id: verify_law_firm
    kind: choice
    question: 'The complaint was read as follows for law firm: {parsed_value}. Do you agree with this
      value?'
    explanation:
      show_with_question: true
      text: The law firm is the office of the lawyer representing the plaintiff in this lawsuit. Look
        at the top left of the complaint’s first page for the law firm, lawyer’s name, firm name, address,
        and telephone number. On a court form, this information is usually in the box labeled “Attorney
        or Party Without Attorney,” with the plaintiff identified next to “Attorney for.” The firm’s name
        may also appear near the lawyer’s signature at the end of the complaint. The law firm is often
        different from the plaintiff or original creditor; if only an individual lawyer is listed, you
        can provide that name.
    idk_skip_branch_id: unknown
    branches:
      - id: 'yes'
        label: Yes, I agree.
        target: verify_suit_type
      - id: 'no'
        label: No, I want to provide a different value.
        target: prelim_law_firm
      - id: unknown
        label: I am not sure.
        target: verify_suit_type
    title: Law Firm
  - id: prelim_law_firm
    kind: input
    question: Who is the law firm helping plaintiff sue?
    input:
      field: law_firm
      type: text
      valid_branch_id: submit
      unknown_branch_id: unknown
    idk_skip_branch_id: unknown
    branches:
      - id: submit
        label: Value supplied.
        target: verify_suit_type
      - id: missing
        label: Not stated in the complaint.
        target: verify_suit_type
      - id: unknown
        label: I do not know.
        target: verify_suit_type
    explanation:
      show_with_question: false
      text: The law firm is the office of the lawyer representing the plaintiff in this lawsuit. Look
        at the top left of the complaint’s first page for the law firm, lawyer’s name, firm name, address,
        and telephone number. On a court form, this information is usually in the box labeled “Attorney
        or Party Without Attorney,” with the plaintiff identified next to “Attorney for.” The firm’s name
        may also appear near the lawyer’s signature at the end of the complaint. The law firm is often
        different from the plaintiff or original creditor; if only an individual lawyer is listed, you
        can provide that name.
    title: Law Firm
  - id: verify_suit_type
    kind: choice
    question: 'The complaint was read as follows for claim type: {parsed_value}. Do you agree with this
      value?'
    explanation:
      show_with_question: true
      text: There are two possible legal claims the plaintiff can list as the reasons for suing you. These
        are called “causes of action.” “Breach of contract” means the plaintiff says you broke an agreement,
        such as an agreement to repay borrowed money. “Common counts” are claims that you owe money, sometimes
        labeled “open book account,” “account stated,” or “money lent.” Look for these claim names on
        the first or second page of the complaint. A complaint can list both breach of contract and common
        counts, so identify all the claims shown.
    idk_skip_branch_id: unknown
    branches:
      - id: 'yes'
        label: Yes, I agree.
        target: prelim_oral
      - id: 'no'
        label: No, I want to provide a different value.
        target: prelim_suit_type
      - id: unknown
        label: I am not sure.
        target: prelim_oral
    title: Suit Type
  - id: prelim_suit_type
    kind: choice
    question: Is the suit for breach of contract, common counts, or both?
    idk_skip_branch_id: unknown
    branches:
      - id: breach
        label: Breach of contract.
        target: prelim_oral
      - id: common
        label: Common counts.
        target: prelim_oral
      - id: both
        label: Both breach of contract and common counts.
        target: prelim_oral
      - id: missing
        label: Neither is stated in the complaint.
        target: prelim_oral
      - id: unknown
        label: I do not know.
        target: prelim_oral
    explanation:
      show_with_question: false
      text: There are two possible legal claims the plaintiff can list as the reasons for suing you. These
        are called “causes of action.” “Breach of contract” means the plaintiff says you broke an agreement,
        such as an agreement to repay borrowed money. “Common counts” are claims that you owe money, sometimes
        labeled “open book account,” “account stated,” or “money lent.” Look for these claim names on
        the first or second page of the complaint. A complaint can list both breach of contract and common
        counts, so identify all the claims shown.
    title: Suit Type
  - id: prelim_oral
    kind: choice
    question: Did you open this account orally, with no written contract?
    idk_skip_branch_id: unknown
    branches:
      - id: 'yes'
        label: Yes.
        target: verify_amount
      - id: 'no'
        label: No.
        target: verify_amount
      - id: unknown
        label: I do not know.
        target: verify_amount
    explanation:
      show_with_question: true
      text: An oral agreement is an agreement made through spoken words with the original creditor. A
        written agreement has terms recorded in a document, such as a credit card agreement, loan agreement,
        or electronic agreement. This field asks whether the agreement the lawsuit is based on is described
        as oral or written. If there is an attached agreement, there is a written agreement. If there
        is no attached agreement, check in the breach-of-contract section for “credit card agreement”,
        “loan agreement”, or “electronic agreement.” Not remembering a signature, or not seeing an agreement
        attached, does not by itself mean the agreement was oral.
    title: Oral Agreement
  - id: verify_amount
    kind: choice
    question: 'The complaint was read as follows for amount claimed: {parsed_value}. Do you agree with
      this value?'
    explanation:
      show_with_question: true
      text: The amount of money that the plaintiff claims you owe in this lawsuit will appear on the first
        or second page of the complaint. The plaintiff may ask for interest, court costs, or attorney’s
        fees separately. This field records the plaintiff’s claim; you can separately say whether you
        agree with it.
    idk_skip_branch_id: unknown
    branches:
      - id: 'yes'
        label: Yes, I agree.
        target: verify_ownership
      - id: 'no'
        label: No, I want to provide a different value.
        target: prelim_correct_amount
      - id: unknown
        label: I am not sure.
        target: verify_ownership
    title: Amount Claimed
  - id: prelim_correct_amount
    kind: input
    question: What amount would you like to enter?
    input:
      field: amount_sued
      type: currency
      valid_branch_id: submit
      unknown_branch_id: unknown
    idk_skip_branch_id: unknown
    branches:
      - id: submit
        label: Value supplied.
        target: verify_ownership
      - id: unknown
        label: I do not know.
        target: verify_ownership
    title: Amount Claimed
    explanation:
      show_with_question: false
      text: The amount of money that the plaintiff claims you owe in this lawsuit will appear on the first
        or second page of the complaint. The plaintiff may ask for interest, court costs, or attorney’s
        fees separately. This field records the plaintiff’s claim; you can separately say whether you
        agree with it.
  - id: verify_ownership
    kind: choice
    question: 'The complaint was read as follows for statement of ownership and right to collect: {parsed_value}.
      Do you agree with this value?'
    explanation:
      show_with_question: true
      blocks:
        - text: The complaint must say the plaintiff owns the debt and has the right to sue to collect
            it. The plaintiff does not need to provide additional proof in order to state ownership.
        - text: When [ORIGINAL.CREDITOR] or other company sold the debt to [PLAINTIFF], it assigned the
            right to collect the debt to [PLAINTIFF]. A debt buyer must state they bought the account
            from the original creditor or another company.  Look in the numbered paragraphs for phrases
            such as “legal owner,” “assignee,” “assigned to plaintiff,” or “all right, title, and interest.”
          creditor_type: buyer
        - text: An original creditor must state it is the legal owner (“true owner”) of the debt and that
            it has the right to bring a debt collection case. Look in the numbered paragraphs for phrases
            such as “legal owner,” “sole owner,” or “all right, title, and interest.”
          creditor_type: original
    idk_skip_branch_id: unknown
    branches:
      - id: 'yes'
        label: Yes, I agree.
        target: verify_last_payment
      - id: 'no'
        label: No, I want to provide a different value.
        target: prelim_ownership_claim
      - id: unknown
        label: I am not sure.
        target: verify_last_payment
    title: Ownership
  - id: prelim_ownership_claim
    kind: choice
    question: Does the plaintiff state it is the true legal owner of the debt and that it has the right
      to collect?
    idk_skip_branch_id: unknown
    branches:
      - id: 'yes'
        label: Yes.
        target: verify_last_payment
      - id: 'no'
        label: No.
        target: verify_last_payment
      - id: unknown
        label: I am not sure.
        target: verify_last_payment
    explanation:
      show_with_question: false
      blocks:
        - text: The complaint must say the plaintiff owns the debt and has the right to sue to collect
            it. The plaintiff does not need to provide additional proof in order to state ownership.
        - text: When [ORIGINAL.CREDITOR] or other company sold the debt to [PLAINTIFF], it assigned the
            right to collect the debt to [PLAINTIFF]. A debt buyer must state they bought the account
            from the original creditor or another company.  Look in the numbered paragraphs for phrases
            such as “legal owner,” “assignee,” “assigned to plaintiff,” or “all right, title, and interest.”
          creditor_type: buyer
        - text: An original creditor must state it is the legal owner (“true owner”) of the debt and that
            it has the right to bring a debt collection case. Look in the numbered paragraphs for phrases
            such as “legal owner,” “sole owner,” or “all right, title, and interest.”
          creditor_type: original
    title: Ownership
  - id: verify_last_payment
    kind: choice
    question: 'The complaint was read as follows for last payment date: {parsed_value}. Do you agree with
      this value?'
    explanation:
      show_with_question: true
      blocks:
        - text: If you’ve made any payments to [PLAINTIFF], the last payment date is the date of the most
            recent payment on the account to [PLAINTIFF]. Otherwise, this is the date of the most recent
            payment to [ORIGINAL.CREDITOR] or another company which owned the debt.
          creditor_type: buyer
        - text: The last payment date is the date of the most recent payment to [PLAINTIFF].
          creditor_type: original
        - text: The complaint may list it in the numbered paragraphs as “last payment date,” and an attached
            statement may show a payment and its date. A “charge-off” date, the date a creditor recorded
            the unpaid balance as a loss, is different from a payment date.
    idk_skip_branch_id: unknown
    branches:
      - id: 'yes'
        label: Yes, I agree.
        target: verify_open_date
      - id: 'no'
        label: No, I want to provide a different value.
        target: prelim_correct_payment
      - id: unknown
        label: I am not sure.
        target: verify_open_date
    title: Last Payment Date
  - id: prelim_correct_payment
    kind: input
    question: What last payment date would you like to enter?
    input:
      field: last_payment_complaint
      type: date
      valid_branch_id: submit
      unknown_branch_id: no_date
    idk_skip_branch_id: no_date
    branches:
      - id: submit
        label: Value supplied.
        target: verify_open_date
      - id: no_date
        label: I do not know.
        target: verify_open_date
    title: Last Payment Date
    explanation:
      show_with_question: false
      blocks:
        - text: If you’ve made any payments to [PLAINTIFF], the last payment date is the date of the most
            recent payment on the account to [PLAINTIFF]. Otherwise, this is the date of the most recent
            payment to [ORIGINAL.CREDITOR] or another company which owned the debt.
          creditor_type: buyer
        - text: The last payment date is the date of the most recent payment to [PLAINTIFF].
          creditor_type: original
        - text: The complaint may list it in the numbered paragraphs as “last payment date,” and an attached
            statement may show a payment and its date. A “charge-off” date, the date a creditor recorded
            the unpaid balance as a loss, is different from a payment date.
  - id: verify_open_date
    kind: choice
    question: 'The complaint was read as follows for account opening date: {parsed_value}. Do you agree
      with this value?'
    explanation:
      show_with_question: true
      text: The account opening date is the date the account was first opened or the agreement began.
        Look in the complaint’s numbered paragraphs for “account opened,” “entered into an agreement,”
        or “contract date,” and check any attached agreement or account records. This is different from
        the date the account was sold to a debt buyer, the date of the last payment, or the date the lawsuit
        was filed. The statement date printed on a monthly bill is not necessarily the account-opening
        date. If the complaint does not give a clear opening date, you can say it is not listed; if you
        disagree with the date, your own account records may help you confirm it.
    idk_skip_branch_id: unknown
    branches:
      - id: 'yes'
        label: Yes, I agree.
        target: verify_filing_date
      - id: 'no'
        label: No, I want to provide a different value.
        target: prelim_correct_open_date
      - id: unknown
        label: I am not sure.
        target: verify_filing_date
    title: Account Opening Date
  - id: prelim_correct_open_date
    kind: input
    question: What account opening date would you like to enter?
    input:
      field: open_date
      type: date
      valid_branch_id: submit
      unknown_branch_id: no_date
    idk_skip_branch_id: no_date
    branches:
      - id: submit
        label: Value supplied.
        target: verify_filing_date
      - id: no_date
        label: I do not know.
        target: verify_filing_date
    title: Account Opening Date
    explanation:
      show_with_question: false
      text: The account opening date is the date the account was first opened or the agreement began.
        Look in the complaint’s numbered paragraphs for “account opened,” “entered into an agreement,”
        or “contract date,” and check any attached agreement or account records. This is different from
        the date the account was sold to a debt buyer, the date of the last payment, or the date the lawsuit
        was filed. The statement date printed on a monthly bill is not necessarily the account-opening
        date. If the complaint does not give a clear opening date, you can say it is not listed; if you
        disagree with the date, your own account records may help you confirm it.
  - id: verify_filing_date
    kind: choice
    question: 'The complaint was read as follows for complaint filing date: {parsed_value}. Do you agree
      with this value?'
    explanation:
      show_with_question: true
      text: The complaint date is the date the plaintiff filed the complaint with the court, starting
        the lawsuit. Look for a court stamp or electronic filing mark on the first page, often near the
        top right, labeled “Filed,” “Electronically Filed,” or “E-Filed.” Use the complaint’s filing date,
        rather than the date next to the lawyer’s signature, the date on the summons, or the date you
        received the papers. If the complaint is marked “Amended,” or you see more than one filing date,
        clinic staff can help identify the original complaint’s filing date. If no filing mark is visible,
        the court’s case record may show when the complaint was filed.
    idk_skip_branch_id: unknown
    branches:
      - id: 'yes'
        label: Yes, I agree.
        target: verify_breach_date
      - id: 'no'
        label: No, I want to provide a different value.
        target: get_filing_date
      - id: unknown
        label: I am not sure.
        target: verify_breach_date
    title: Complaint Filing Date
  - id: get_filing_date
    kind: input
    question: What is the complaint's filing date? Use the filing date, not the date you received it.
      [FILING-DATE]
    input:
      field: filing_date
      type: date
      valid_branch_id: submit
      unknown_branch_id: no_date
    idk_skip_branch_id: no_date
    branches:
      - id: submit
        label: Date supplied.
        target: verify_breach_date
      - id: missing
        label: Not stated in the complaint.
        target: verify_breach_date
      - id: no_date
        label: I do not know the date.
        target: verify_breach_date
    explanation:
      show_with_question: false
      text: The complaint date is the date the plaintiff filed the complaint with the court, starting
        the lawsuit. Look for a court stamp or electronic filing mark on the first page, often near the
        top right, labeled “Filed,” “Electronically Filed,” or “E-Filed.” Use the complaint’s filing date,
        rather than the date next to the lawyer’s signature, the date on the summons, or the date you
        received the papers. If the complaint is marked “Amended,” or you see more than one filing date,
        clinic staff can help identify the original complaint’s filing date. If no filing mark is visible,
        the court’s case record may show when the complaint was filed.
    title: Complaint Filing Date
  - id: verify_statement
    kind: choice
    question: 'The complaint was read as follows for attached final statement: {parsed_value}. Do you
      agree with this value?'
    explanation:
      show_with_question: true
      blocks:
        - text: An account statement is a bill or record from the creditor showing activity and the balance
            on an account. A credit card statement usually includes the creditor’s name, your name, part
            of the account number, a statement period, charges, payments, and a balance. This field asks
            whether a final statement showing your final balance is attached to the complaint.
        - text: The final statement should include a charge-off date, reflecting when [ORIGINAL.CREDITOR]
            recorded the balance as a loss.
          creditor_type: buyer
        - text: Look through the pages after the complaint for documents labeled “Exhibit” or “Attachment,”
            especially pages that look like monthly bills. A credit card agreement lists account terms
            and is different from a statement. A paragraph saying how much you owe is also different from
            an attached statement.
    idk_skip_branch_id: unknown
    branches:
      - id: 'yes'
        label: Yes, I agree.
