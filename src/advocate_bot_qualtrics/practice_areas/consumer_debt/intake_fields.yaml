# Preliminary fields and approved explanations from the October 30 script.
source: docs/source-material/2026-10-30/2026.10.30-preliminary-fields.docx
fields:
  guided_case_number:
    field: CASE.NUMBER
    tag: CASE.NUMBER
    label: Case number
    title: What is the case number?
    input_type: text
    binding: prelim_case_number
    help:
    - text: The case number is the court-assigned number for identifying the case. It prominently appears
        in the top right quadrant of the complaint’s first page.
  guided_plaintiff:
    field: PLAINTIFF
    tag: PLAINTIFF-NAME
    label: Plaintiff
    title: Who is suing you?
    input_type: text
    binding: get_plaintiff_name
    help:
    - text: The plaintiff is who is suing you for money. You can find the plaintiff name on the first
        page of the complaint, almost always in the top half of the page.
  guided_creditor_type:
    field: PLAINTIFF.TYPE
    tag: PLAINTIFF
    label: Plaintiff type
    title: Is the plaintiff an original creditor or debt buyer?
    input_type: choice
    binding: prelim_creditor_type
    help:
    - text: An "original creditor" is the company you originally owed the debt to — for example, the bank
        or credit card company whose card you used. A "debt buyer" is a company that purchases old or
        unpaid debts from original creditors (often for pennies on the dollar) and then tries to collect
        on them. Companies like Cavalry SPV, Midland Credit Management, and Portfolio Recovery Associates
        are typically debt buyers.
    options:
    - value: original
      label: Original creditor
    - value: buyer
      label: Debt buyer
    - value: unknown
      label: I’m not sure
  guided_original_creditor:
    field: ORIGINAL.CREDITOR
    tag: ORIGINAL.CREDITOR
    label: Original creditor
    title: Who is the original creditor?
    input_type: text
    binding: prelim_original_creditor
    help:
    - text: The original creditor is the company you first owed the debt to, before it was sold or transferred
        to another company. For a credit card, this is usually the bank that issued the card, which may
        be different from the store or brand printed on it. Look in the complaint’s numbered paragraphs
        for “original creditor,” “original issuer,” or “charge-off creditor,” and check any attached account
        statements. A charge-off creditor is the company that held the account when it recorded the unpaid
        balance as a loss; it is not always the original creditor. Your older statements or account agreement
        may help you confirm the name.
  guided_law_firm:
    field: LAW.FIRM
    tag: LAW-FIRM
    label: Plaintiff’s law firm
    title: Which law firm is helping the plaintiff sue?
    input_type: text
    binding: prelim_law_firm
    help:
    - text: The law firm is the office of the lawyer representing the plaintiff in this lawsuit. Look
        at the top left of the complaint’s first page for the law firm, lawyer’s name, firm name, address,
        and telephone number. On a court form, this information is usually in the box labeled “Attorney
        or Party Without Attorney,” with the plaintiff identified next to “Attorney for.” The firm’s name
        may also appear near the lawyer’s signature at the end of the complaint. The law firm is often
        different from the plaintiff or original creditor; if only an individual lawyer is listed, you
        can provide that name.
  guided_suit_type:
    field: SUIT.TYPE
    tag: SUIT-TYPE
    label: Claims in the complaint
    title: Is the suit for breach of contract, common counts, or both?
    input_type: choice
    binding: prelim_suit_type
    help:
    - text: There are two possible legal claims the plaintiff can list as the reasons for suing you. These
        are called “causes of action.” “Breach of contract” means the plaintiff says you broke an agreement,
        such as an agreement to repay borrowed money. “Common counts” are claims that you owe money, sometimes
        labeled “open book account,” “account stated,” or “money lent.” Look for these claim names on
        the first or second page of the complaint. A complaint can list both breach of contract and common
        counts, so identify all the claims shown.
    options:
    - value: breach
      label: Breach of contract
    - value: common
      label: Common counts
    - value: both
      label: Both
    - value: unknown
      label: I’m not sure
  guided_amount:
    field: AMOUNT
    tag: AMOUNT
    label: Amount claimed
    title: How much is being sued for?
    input_type: currency
    binding: get_amount_sued
    help:
    - text: The amount of money that the plaintiff claims you owe in this lawsuit will appear on the first
        or second page of the complaint. The plaintiff may ask for interest, court costs, or attorney’s
        fees separately. This field records the plaintiff’s claim; you can separately say whether you
        agree with it.
  guided_payment_date:
    field: LAST.PAYMENT.DATE
    tag: LAST-PAYMENT-DATE
    label: Complaint’s last payment
    title: What last-payment date is listed in the complaint?
    input_type: date
    binding: prelim_last_payment
    help:
    - text: If you’ve made any payments to [PLAINTIFF], the last payment date is the date of the most
        recent payment on the account to [PLAINTIFF]. Otherwise, this is the date of the most recent payment
        to [ORIGINAL.CREDITOR] or another company which owned the debt.
      creditor_type: buyer
    - text: The last payment date is the date of the most recent payment to [PLAINTIFF].
      creditor_type: original
    - text: The complaint may list it in the numbered paragraphs as “last payment date,” and an attached
        statement may show a payment and its date. A “charge-off” date, the date a creditor recorded the
        unpaid balance as a loss, is different from a payment date.
    - text: The complaint lists the last payment date as [LAST.PAYMENT.DATE].
      payment_status: present
    - text: The complaint does not appear to list the last payment date.
      payment_status: missing
    allow_missing: true
  guided_open_date:
    field: OPEN.DATE
    tag: OPEN-DATE
    label: Account opened
    title: What account-opening date is listed in the complaint?
    input_type: date
    binding: prelim_open_date
    help:
    - text: The account opening date is the date the account was first opened or the agreement began.
        Look in the complaint’s numbered paragraphs for “account opened,” “entered into an agreement,”
        or “contract date,” and check any attached agreement or account records. This is different from
        the date the account was sold to a debt buyer, the date of the last payment, or the date the lawsuit
        was filed. The statement date printed on a monthly bill is not necessarily the account-opening
        date. If the complaint does not give a clear opening date, you can say it is not listed; if you
        disagree with the date, your own account records may help you confirm it.
    allow_missing: true
  guided_filing_date:
    field: COMPLAINT.DATE
    tag: FILING-DATE
    label: Complaint filed
    title: When was the complaint filed?
    input_type: date
    binding: get_filing_date
    help:
    - text: The complaint date is the date the plaintiff filed the complaint with the court, starting
        the lawsuit. Look for a court stamp or electronic filing mark on the first page, often near the
        top right, labeled “Filed,” “Electronically Filed,” or “E-Filed.” Use the complaint’s filing date,
        rather than the date next to the lawyer’s signature, the date on the summons, or the date you
        received the papers. If the complaint is marked “Amended,” or you see more than one filing date,
        clinic staff can help identify the original complaint’s filing date. If no filing mark is visible,
        the court’s case record may show when the complaint was filed.
    allow_missing: false
  guided_breach_date:
    field: BREACH.DATE
    tag: BREACH-DATE
    label: Complaint’s breach date
    title: What breach date is listed in the complaint?
    input_type: date
    binding: prelim_breach_date
    help:
    - text: The breach date is when the plaintiff says the contract with the original creditor was breached.
        This is also known as the charge-off date, and it usually occurs after four to six months of missed
        payments.
    allow_missing: true
  guided_statement:
    field: STATEMENT
    tag: STATEMENT
    label: Final statement attached
    title: Is there a final statement attached?
    input_type: choice
    binding: prelim_statement
    help:
    - text: An account statement is a bill or record from the creditor showing activity and the balance
        on an account. A credit card statement usually includes the creditor’s name, your name, part of
        the account number, a statement period, charges, payments, and a balance. This field asks whether
        a final statement showing your final balance is attached to the complaint.
    - text: The final statement should include a charge-off date, reflecting when [ORIGINAL.CREDITOR]
        recorded the balance as a loss.
      creditor_type: buyer
    - text: Look through the pages after the complaint for documents labeled “Exhibit” or “Attachment,”
        especially pages that look like monthly bills. A credit card agreement lists account terms and
        is different from a statement. A paragraph saying how much you owe is also different from an attached
        statement.
    options:
    - value: 'yes'
      label: 'Yes'
    - value: 'no'
      label: 'No'
    - value: unknown
      label: I’m not sure
  guided_ownership_claim:
    field: OWNERSHIP
    tag: OWNERSHIP
    label: Ownership stated
    title: Does the plaintiff state it is the true legal owner of the debt and has the right to collect?
    input_type: choice
    binding: prelim_ownership_claim
    help:
    - text: The complaint must say the plaintiff owns the debt and has the right to sue to collect it.
        The plaintiff does not need to provide additional proof in order to state ownership.
    - text: When [ORIGINAL.CREDITOR] or other company sold the debt to [PLAINTIFF], it assigned the right
        to collect the debt to [PLAINTIFF]. A debt buyer must state they bought the account from the original
        creditor or another company.  Look in the numbered paragraphs for phrases such as “legal owner,”
        “assignee,” “assigned to plaintiff,” or “all right, title, and interest.”
      creditor_type: buyer
    - text: An original creditor must state it is the legal owner (“true owner”) of the debt and that
        it has the right to bring a debt collection case. Look in the numbered paragraphs for phrases
        such as “legal owner,” “sole owner,” or “all right, title, and interest.”
      creditor_type: original
    options:
    - value: 'yes'
      label: 'Yes'
    - value: 'no'
      label: 'No'
    - value: unknown
      label: I’m not sure
  guided_ownership_proof:
    field: OWNERSHIP.PROOF
    tag: OWNERSHIP.PROOF
    label: Ownership proof attached
    title: Is proof of ownership attached?
    input_type: choice
    binding: prelim_ownership
    help:
    - text: Proof of ownership consists of documents supporting the plaintiff’s claimed ownership or right
        to collect, attached to the complaint. Flip to the exhibits and attachments after the main complaint
        form.
    - text: Look for an “assignment,” “bill of sale,” or purchase agreement, along with a schedule or
        account record which shows that [PLAINTIFF] purchased your debt from [ORIGINAL.CREDITOR] or another
        company. A document about the sale of many accounts (from other consumers with debt) may count.
        A final account statement can help identify the account, but does not necessarily show a transfer
        to [PLAINTIFF].
      creditor_type: buyer
    - text: Look for an account agreement and records (like account statements) connecting your account
        to [PLAINTIFF].
      creditor_type: original
    options:
    - value: 'yes'
      label: 'Yes'
    - value: 'no'
      label: 'No'
    - value: unknown
      label: I’m not sure
  guided_verified:
    field: VERIFIED
    tag: VERIFIED
    label: Complaint verified
    title: Is the complaint verified?
    input_type: choice
    binding: prelim_verified
    help:
    - text: A verified complaint includes a signed statement declaring that its contents are true under
        oath or under penalty of perjury. Look near the end of the main body of the complaint or on a
        separate attached page for a heading such as “Verification” and wording about the truth of the
        complaint. The statement may be signed by the plaintiff, a company representative, or an attorney.
        A lawyer’s ordinary signature at the end of the complaint does not, by itself, make the complaint
        verified. A declaration about delivering the papers to you, called a proof of service, is different
        from a verification of the complaint. If you are unsure which document you have, clinic staff
        can help you identify it.
    options:
    - value: 'yes'
      label: 'Yes'
    - value: 'no'
      label: 'No'
    - value: unknown
      label: I’m not sure
  guided_consolidation:
    field: CONSOLIDATION
    tag: CONSOLIDATION
    label: Debt consolidation company
    title: Are you working with a debt consolidation company?
    input_type: choice
    binding: prelim_consolidation
    help:
    - text: This field asks whether you are working with a company or organization that helps manage,
        combine, or negotiate your debts. Some programs arrange payments to creditors; others try to negotiate
        a settlement for less than the amount claimed. You might make a single monthly payment to the
        company or authorize it to contact creditors for you. Taking out a new loan to pay off other debts
        is different from having a company negotiate or manage payments on your behalf.
    options:
    - value: 'yes'
      label: 'Yes'
    - value: 'no'
      label: 'No'
    - value: unknown
      label: I’m not sure
  guided_recognize:
    field: RECOGNIZE
    tag: RECOGNIZE
    label: Account recognized
    title: Do you recognize this account as one you opened?
    input_type: choice
    binding: prelim_recognize
    help:
    - text: To determine if the plaintiff can sue you, check if you recognize the account in the complaint
        as one you opened. Look for the original creditor’s name, the account number or its last few digits,
        and any attached statements showing your name or purchases. Compare those details with your own
        memory or records. You may recognize the account as yours even if you do not recognize the debt
        buyer suing you. Recognizing the account does not mean you agree with the amount claimed. Using
        someone else’s card is also different from opening an account yourself. If the details are too
        limited to tell, you can say you are not sure.
    options:
    - value: 'yes'
      label: 'Yes'
    - value: 'no'
      label: 'No'
    - value: unknown
      label: I’m not sure
  guided_oral:
    field: ORAL
    tag: ORAL
    label: Oral agreement
    title: Did you open this account orally, with no written contract?
    input_type: choice
    binding: prelim_oral
    help:
    - text: An oral agreement is an agreement made through spoken words with the original creditor. A
        written agreement has terms recorded in a document, such as a credit card agreement, loan agreement,
        or electronic agreement. This field asks whether the agreement the lawsuit is based on is described
        as oral or written. If there is an attached agreement, there is a written agreement. If there
        is no attached agreement, check in the breach-of-contract section for “credit card agreement”,
        “loan agreement”, or “electronic agreement.” Not remembering a signature, or not seeing an agreement
        attached, does not by itself mean the agreement was oral.
    options:
    - value: 'yes'
      label: 'Yes'
    - value: 'no'
      label: 'No'
    - value: unknown
      label: I’m not sure
