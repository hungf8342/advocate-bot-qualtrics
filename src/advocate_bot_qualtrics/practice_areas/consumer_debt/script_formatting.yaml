- text: INSTRUCTIONS FOR REVIEWERS
  source_index: 2
- text: Use these scripts to review the exact wording users see and the conditions that control the conversation.
    Each defense begins with its general explanation. The flow and each defense matches Attachment 4.
  source_index: 3
- text: Please review quoted wording, screening conditions, missing outcomes, and how well the defenses
    match with Attachment 4. Ignore the footnotes. Use Track Changes for proposed edits and comments for
    questions.
