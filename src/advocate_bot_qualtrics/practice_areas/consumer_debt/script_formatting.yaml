- text: You said that you were given the credit card agreement in [LANGUAGE] before signing.
  source_index: 853
- text: This defense does not apply based on that answer.
  source_index: 854
- text: Finish this defense.
  source_index: 855
- text: 'If either the negotiation-language answer OR the translation answer is Not sure:'
  source_index: 856
- text: Clarify an unresolved answer.
  source_index: 857
- text: You’re not sure what language was used when you opened the account  or whether a translation was
    provided. Copies of the agreement and messages from when you opened the account may help clarify this.
  source_index: 858
- text: Confirm selections.
  source_index: 859
- text: Common questions
  source_index: 861
- text: Should I call the original creditor to negotiate?
  source_index: 862
  list_level: 0
  list_format: bullet
- text: 'No, call their lawyer: contact info is on the summons and complaint'
  source_index: 863
  list_level: 1
  list_format: bullet
- text: How many copies should I make of my forms?
  source_index: 864
  list_level: 0
  list_format: bullet
- text: Original answer + copy, proof of service, fee waiver → court, who will give you back an answer
    copy
  source_index: 865
  list_level: 1
  list_format: bullet
- text: Mail copy of answer
  source_index: 866
  list_level: 1
  list_format: bullet
- text: 'For litigant: copy of answer, fee waiver, proof of service'
  source_index: 867
  list_level: 1
  list_format: bullet
- text: Should I check attorney's fees in the prayer section even if I'm not sure I'll win?
  source_index: 868
  list_level: 0
  list_format: bullet
- text: 'Yes: it''s important to preserve your defenses and options'
  source_index: 869
  list_level: 1
  list_format: bullet
- text: What if I can't get in touch with the lawyer for my debt collector?
  source_index: 870
  list_level: 0
  list_format: bullet
- text: Keep calling - it can take several attempts to contact them. If you can, send an email as well
    so you have written proof of your attempts to contact them.
  source_index: 871
  list_level: 1
  list_format: bullet
- text: Which window do I go to?
  source_index: 872
  list_level: 0
  list_format: bullet
- text: For Chatsworth - Windows 10 or 11, says “Limited Civil and Small Claims” above the window. They
    will stamp and give you the answer copy, and take the answer original and fee waiver.
  source_index: 873
  list_level: 1
  list_format: bullet
