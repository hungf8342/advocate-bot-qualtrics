- text: This defense may apply if you tried to make a payment to [PLAINTIFF], but [PLAINTIFF] refused
    to accept it.
  source_index: 800
- text: 'If the user previously reported a declined settlement offer before suit:'
  source_index: 801
- text: Earlier, you said that [PLAINTIFF] declined a settlement offer before suing.
  source_index: 802
- text: The question below asks separately whether [PLAINTIFF] refused a payment you tried to make.
  source_index: 803
- text: Ask about a refused payment
  source_index: 804
- text: 'Ask:'
  source_index: 805
- text: Did you try to make a payment to [PLAINTIFF] that [PLAINTIFF] refused to accept?
  source_index: 806
  screen_footnotes:
  - '101'
- text: 'If Yes:'
  source_index: 807
  screen_footnotes:
  - '102'
- text: You said that you tried to make a payment and [PLAINTIFF] refused to accept it. This defense may
    apply.
  source_index: 808
- text: Many people in this situation check this box to keep the option of using this defense later.
  source_index: 809
- text: Record the user’s checkbox choice.
  source_index: 810
- text: 'If No:'
  source_index: 811
  screen_footnotes:
