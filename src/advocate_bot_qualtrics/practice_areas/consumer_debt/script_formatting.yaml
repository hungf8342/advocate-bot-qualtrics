- text: You haven’t identified a payment that you tried to make and [PLAINTIFF] refused to accept.
  source_index: 812
- text: This defense may not apply based on that answer.
  source_index: 813
- text: Finish this defense.
  source_index: 814
- text: 'If Not sure:'
  source_index: 815
- text: Clarify an unresolved answer.
  source_index: 816
- text: 'You’re not sure if [PLAINTIFF] refused a payment you tried to make. You may want to check if
