    owner of the debt and has the right to collect.
  source_index: 175
- text: 'If the complaint does not make that statement:'
  source_index: 176
- text: The first indented checkbox may apply since [PLAINTIFF] did not state it is the legal owner of
    the debt or it has the right to collect. Many people in this situation check off the first indented
    checkbox.
  source_index: 177
