- text: 'If No:'
  source_index: 838
  screen_footnotes:
  - '107'
- text: You said that you did not apply for the credit card in [LANGUAGE]. This defense may not apply
    based on that answer.
  source_index: 839
- text: Finish this defense.
  source_index: 840
- text: If Yes ask about the translated agreement
  source_index: 841
- text: 'Ask:'
  source_index: 842
- text: Did the original creditor give you the credit card agreement in [LANGUAGE] before you signed?
  source_index: 843
  screen_footnotes:
  - '108'
- text: 'If the required translation was not provided:'
  source_index: 844
  screen_footnotes:
  - '109'
- text: 'You said that:'
  source_index: 845
- text: your primary language is [LANGUAGE]
  source_index: 846
  list_level: 0
  list_format: bullet
- text: the agreement was mostly discussed in [LANGUAGE]
  source_index: 847
  list_level: 0
  list_format: bullet
- text: you were not given the agreement or translation in that language before signing
  source_index: 848
  list_level: 0
  list_format: bullet
- text: This defense may apply if the law required a translation of your agreement in [LANGUAGE].
  source_index: 849
- text: Many people in this situation check this box to keep the option of using this defense later.
  source_index: 850
- text: Record the user’s checkbox choice.
  source_index: 851
- text: 'If it was provided:'
  source_index: 852
  screen_footnotes:
