[project]
name = "advocate-bot-qualtrics"
version = "0.1.0"
description = "Legal complaint fact extraction for advocate bot / Qualtrics"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.52.0",
  "openai>=1.40.0",
  "pydantic>=2.7.0",
  "python-dotenv>=1.0.1",
  "PyYAML>=6.0.0",
  "pypdf>=6.12.2",
  "openpyxl>=3.1.0",
]

[project.optional-dependencies]
demo = ["gradio>=4.44.0"]
dev = [
  "pytest>=8.0.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"advocate_bot_qualtrics.practice_areas.consumer_debt" = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
